<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JP Stream Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .app-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }
    .app-logo {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
    }
    .player-container {
      width: 100%;
      max-width: 800px;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    video {
      width: 100%;
      height: auto;
      display: block;
    }
    .channel-container {
      width: 100%;
      max-width: 800px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
    }
    .channel-card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: background 0.2s ease-in-out;
    }
    .channel-card:hover {
      background: #007bff;
    }
    .channel-logo {
      width: 40px;
      height: 40px;
      object-fit: contain;
      border-radius: 4px;
    }
    .channel-name {
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <div class="app-header">
    <img src="logo.png" alt="App Logo" class="app-logo" onerror="this.src='https://via.placeholder.com/50'">
    <h2>Web Stream Player</h2>
  </div>

  <div class="player-container">
    <video id="video-player" controls autoplay></video>
  </div>

  <div class="channel-container" id="channel-list"></div>

  <script>
    // Sample channel list (Replace with your actual playlist data or dynamic fetch)
    const channelData = [
      { name: "Sports HD", logo: "https://via.placeholder.com/40", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" },
      { name: "Action Cinema", logo: "https://via.placeholder.com/40", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" },
      { name: "News 24", logo: "https://via.placeholder.com/40", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" },
      { name: "Discovery Live", logo: "https://via.placeholder.com/40", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" },
      { name: "Bollywood Hits", logo: "https://via.placeholder.com/40", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" }
    ];

    // Function to sort channels from A to Z alphabetically
    function sortChannelsAlphabetically(channels) {
      return channels.sort((a, b) => {
        const nameA = (a.name || "").trim().toUpperCase();
        const nameB = (b.name || "").trim().toUpperCase();
        return nameA.localeCompare(nameB, undefined, { numeric: true, sensitivity: 'base' });
      });
    }

    // Function to play video stream using Hls.js
    function playStream(url) {
      const video = document.getElementById('video-player');
      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('loadedmetadata', () => video.play());
      }
    }

    // Function to render channels to the page
    function renderChannels(channels) {
      const sortedChannels = sortChannelsAlphabetically(channels);
      const container = document.getElementById('channel-list');
      container.innerHTML = '';

      sortedChannels.forEach(channel => {
        const card = document.createElement('div');
        card.className = 'channel-card';
        card.onclick = () => playStream(channel.url);

        card.innerHTML = `
          <img class="channel-logo" src="${channel.logo}" alt="${channel.name}" onerror="this.src='https://via.placeholder.com/40'">
          <span class="channel-name">${channel.name}</span>
        `;

        container.appendChild(card);
      });
    }

    // Initialize the list on page load
    document.addEventListener("DOMContentLoaded", () => {
      renderChannels(channelData);
    });
  </script>

</body>
</html>
