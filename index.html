<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JP ALL IN ONE</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0b1120; color: #f3f4f6; padding: 12px; }
        
        /* Top Branding Header */
        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #1e293b;
            margin-bottom: 12px;
        }
        .brand-logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #2563eb;
        }
        .brand-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffffff;
        }

        /* Responsive Navigation / Tools */
        .nav-tools {
            display: flex;
            justify-content: space-around;
            gap: 6px;
            margin-bottom: 16px;
            background: #1e293b;
            padding: 8px;
            border-radius: 10px;
        }
        .nav-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            font-size: 0.85rem;
        }
        .nav-btn.active {
            background: #2563eb;
            color: #ffffff;
        }

        .container { max-width: 600px; margin: 0 auto; }
    </style>
</head>
<body>

<div class="container">
    <!-- Top Name & Logo -->
    <div class="brand-header">
        <img src="https://via.placeholder.com/45" alt="Logo" class="brand-logo" id="appLogo">
        <h1 class="brand-title">JP ALL IN ONE</h1>
    </div>

    <!-- Navigation / Tools below Header -->
    <div class="nav-tools">
        <button class="nav-btn active">✏️ Editor</button>
        <button class="nav-btn">➕ Create</button>
        <button class="nav-btn">🖼️ Gallery</button>
    </div>
</div>

<script>
    // IndexedDB Setup
    const dbName = "JP_PlaylistDB";
    let db;

    const request = indexedDB.open(dbName, 1);

    request.onupgradeneeded = function(e) {
        db = e.target.result;
        if (!db.objectStoreNames.contains("playlists")) {
            db.createObjectStore("playlists", { keyPath: "id" });
        }
    };

    request.onsuccess = function(e) {
        db = e.target.result;
        console.log("IndexedDB Ready!");
    };

    request.onerror = function(e) {
        console.error("IndexedDB Error:", e.target.errorCode);
    };

    // Save Data to IndexedDB (No Size Limit Error)
    function saveToIndexedDB(key, data) {
        if (!db) return;
        const transaction = db.transaction(["playlists"], "readwrite");
        const store = transaction.objectStore("playlists");
        store.put({ id: key, content: data });
    }

    // Read Data from IndexedDB
    function getFromIndexedDB(key, callback) {
        if (!db) return;
        const transaction = db.transaction(["playlists"], "readonly");
        const store = transaction.objectStore("playlists");
        const request = store.get(key);
        
        request.onsuccess = function() {
            if (request.result) callback(request.result.content);
        };
    }
</script>

</body>
</html>
