<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08101f">
<title>JP M3U GENERATOR</title>
<style>
*{box-sizing:border-box}html,body{overflow-x:hidden;max-width:100vw}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#070b16;color:#eef3ff}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:#18243a;color:#fff;font-weight:600}button.primary{background:#2563eb}button.danger{background:#b42318}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:#0b1220;border-right:1px solid #1d2a40;padding:15px}
.brand{font-weight:800;font-size:18px;margin-bottom:20px;color:#2563eb}
.nav button{width:100%;text-align:left;margin:4px 0;background:transparent;padding:12px;border-radius:8px;display:flex;align-items:center;gap:10px;color:#9fb0ca}
.nav button.active,.nav button:hover{background:#17243a;color:#fff}
.main{padding:20px;max-width:1400px;width:100%;margin:auto}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:15px}
.top h1{margin:0;font-size:22px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:15px}
.stat{background:#0d1627;border:1px solid #1b2a42;padding:12px;border-radius:12px}
.stat b{font-size:20px;display:block}
.muted{color:#8fa1bc;font-size:12px}
.card{background:#0d1627;border:1px solid #1b2a42;border-radius:14px;padding:16px;margin-bottom:15px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
label{font-size:12px;color:#9fb0ca;display:block;margin-bottom:5px}
input,select,textarea{width:100%;background:#080f1c;color:#eef3ff;border:1px solid #263752;border-radius:8px;padding:10px;outline:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.channel{display:grid;grid-template-columns:25px 40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border-bottom:1px solid #19263b}
.channel:last-child{border-bottom:0}
.logo{width:40px;height:40px;object-fit:contain;background:#07101d;border-radius:8px;border:1px solid #25344d}
.chk{width:18px;height:18px;accent-color:#2563eb}
.tab{display:none}.tab.active{display:block}
.small{font-size:12px}

@media(max-width:800px){
  .app{display:block}
  .side{width:100%;border-right:0;border-bottom:1px solid #1d2a40;padding:10px}
  .nav{display:flex;overflow-x:auto;gap:6px}
  .nav button{width:auto;white-space:nowrap;padding:8px 12px}
  .main{padding:10px}
  .grid,.grid3{grid-template-columns:1fr}
  .channel{grid-template-columns:20px 35px minmax(0,1fr)}
  .channel .tools{grid-column:1 / -1;display:flex;gap:5px;margin-top:5px}
  .channel .tools button{flex:1;padding:6px;font-size:12px}
}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand">📺 JP M3U <span style="font-size:10px;background:#17243a;padding:2px 6px;border-radius:10px;color:#fff">ULTRA</span></div>
  <div class="nav">
    <button class="active" onclick="switchTab('editor', this)">✏️ Editor</button>
    <button onclick="switchTab('create', this)">➕ Create</button>
    <button onclick="switchTab('logo', this)">🖼️ Logo</button>
    <button onclick="switchTab('builder', this)">🧩 Builder</button>
    <button onclick="switchTab('tools', this)">🛠️ Tools</button>
    <button onclick="switchTab('export', this)">📤 Export</button>
  </div>
</aside>

<main class="main">
<div class="top">
  <h1 id="pageTitle">Playlist Editor</h1>
  <div class="actions">
    <button onclick="document.getElementById('file').click()">📂 Import File</button>
    <button class="primary" onclick="switchTab('create')">➕ Add Channel</button>
    <input id="file" type="file" accept=".m3u,.m3u8,.txt" hidden onchange="importFile(event)">
  </div>
</div>

<!-- 1. EDITOR TAB -->
<section id="editor" class="tab active">
<div class="stats">
  <div class="stat"><b id="sChannels">0</b><span class="muted">Channels</span></div>
  <div class="stat"><b id="sGroups">0</b><span class="muted">Groups</span></div>
  <div class="stat"><b id="sLogos">0</b><span class="muted">With Logo</span></div>
</div>

<div class="card">
  <div class="grid3">
    <div><label>Search</label><input id="search" placeholder="Search channel or URL..." oninput="renderPlaylist()"></div>
    <div><label>Category Filter</label><select id="groupFilter" onchange="renderPlaylist()"><option value="">All Groups</option></select></div>
    <div><label>Playlist Name</label><input id="playlistTitle" value="My M3U Playlist"></div>
  </div>
</div>

<div class="card">
  <div class="row" style="margin-bottom:10px">
    <label class="small"><input type="checkbox" id="selAll" onchange="toggleSelAll(this.checked)"> Select All</label>
    <span class="small muted" id="selCount">0 selected</span>
    <button class="danger" id="bulkDelBtn" onclick="bulkDelete()" style="display:none;padding:5px 10px;font-size:12px">🗑️ Delete Selected</button>
  </div>
  <div id="list"></div>
  <div class="row" style="justify-content:space-between;margin-top:15px">
    <button onclick="gotoPage(currentPage-1)">◀ Prev</button>
    <span id="pageInfo" class="small muted">Page 1</span>
    <button onclick="gotoPage(currentPage+1)">Next ▶</button>
  </div>
</div>
</section>

<!-- 2. CREATE TAB -->
<section id="create" class="tab">
  <div class="card">
    <h3>নতুন চ্যানেল যোগ করুন</h3>
    <div class="grid">
      <div><label>চ্যানেলের নাম</label><input id="cName" placeholder="e.g. Sports HD"></div>
      <div><label>স্ট্রিম URL (m3u8)</label><input id="cUrl" placeholder="https://domain.com/live.m3u8"></div>
      <div><label>লোগো URL</label><input id="cLogo" placeholder="https://domain.com/logo.png"></div>
      <div><label>ক্যাটাগরি</label><input id="cGroup" placeholder="Sports"></div>
    </div>
    <div style="margin-top:15px"><button class="primary" onclick="addCustomChannel()">💾 Save Channel</button></div>
  </div>
</section>

<!-- 3. LOGO TAB -->
<section id="logo" class="tab">
  <div class="card">
    <h3>লোগো অটো ম্যাচ ও ম্যানেজমেন্ট</h3>
    <p class="muted">যেসব চ্যানেলে লোগো নেই সেগুলোতে লোগো বসান।</p>
    <button class="primary" onclick="autoFixLogos()">⚡ Fix Missing Logos</button>
  </div>
</section>

<!-- 4. BUILDER TAB -->
<section id="builder" class="tab">
  <div class="card">
    <h3>কাস্টম ফিল্টার বিল্ডার</h3>
    <div class="grid">
      <div><label>নির্দিষ্ট ক্যাটাগরি বাছাই করুন</label><select id="bGroupSelect"><option value="">সকল ক্যাটাগরি</option></select></div>
    </div>
    <div style="margin-top:15px"><button class="primary" onclick="exportM3U()">📥 শুধুমাত্র এই ক্যাটাগরি এক্সপোর্ট করুন</button></div>
  </div>
</section>

<!-- 5. TOOLS TAB -->
<section id="tools" class="tab">
  <div class="card">
    <h3>প্লেলিস্ট ক্লিনআপ টুলস</h3>
    <div class="row">
      <button class="primary" onclick="removeDuplicates()">🗑️ ডুপ্লিকেট চ্যানেল মুছে ফেলুন</button>
      <button class="danger" onclick="clearAllData()">⚠️ সব ডাটা ক্লিয়ার করুন</button>
    </div>
  </div>
</section>

<!-- 6. EXPORT TAB -->
<section id="export" class="tab">
  <div class="card">
    <h3>এক্সপোর্ট ফাইল</h3>
    <div class="row">
      <button class="primary" onclick="exportM3U()">📥 Download M3U File</button>
      <button onclick="copyM3UText()">📋 Copy M3U Text</button>
    </div>
  </div>
</section>

</main>
</div>

<script>
// Memory Storage (Storage Full Error রোধ করার জন্য)
var channels = [];
var currentPage = 1;
var pageSize = 50;
var selectedIndices = new Set();

function switchTab(tabId, btn) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
    
    var activeTab = document.getElementById(tabId);
    if(activeTab) activeTab.classList.add('active');
    
    if(btn) {
        btn.classList.add('active');
        document.getElementById('pageTitle').innerText = btn.innerText;
    }
}

// নিরাপদে ডাটা সেভ করার সিস্টেম (যা ফুল স্টোরেজ এরর দিবে না)
function safeSave() {
    try {
        // শুধুমাত্র লাইটওয়েট সেভ
        if(channels.length < 5000) {
            localStorage.setItem('jp_m3u_lite', JSON.stringify(channels.slice(0, 2000)));
        }
    } catch(e) {
        console.log("Memory mode active - Quota exceeded prevented");
    }
}

function safeLoad() {
    try {
        var data = localStorage.getItem('jp_m3u_lite');
        if(data) channels = JSON.parse(data);
    } catch(e) {}
}

document.addEventListener("DOMContentLoaded", function() {
    safeLoad();
    renderPlaylist();
});

function renderPlaylist() {
    var searchVal = document.getElementById('search').value.toLowerCase();
    var groupVal = document.getElementById('groupFilter').value;

    var groupSelect = document.getElementById('groupFilter');
    var bGroupSelect = document.getElementById('bGroupSelect');
    var existingGroups = new Set(channels.map(c => c.group).filter(Boolean));
    
    groupSelect.innerHTML = '<option value="">All Groups</option>';
    if(bGroupSelect) bGroupSelect.innerHTML = '<option value="">All Groups</option>';
    
    existingGroups.forEach(g => {
        var opt = document.createElement('option');
        opt.value = g; opt.innerText = g;
        if(g === groupVal) opt.selected = true;
        groupSelect.appendChild(opt);
        if(bGroupSelect) bGroupSelect.appendChild(opt.cloneNode(true));
    });

    var filtered = channels.filter((ch, idx) => {
        ch._origIdx = idx;
        var matchesSearch = !searchVal || (ch.name && ch.name.toLowerCase().includes(searchVal)) || (ch.url && ch.url.toLowerCase().includes(searchVal));
        var matchesGroup = !groupVal || ch.group === groupVal;
        return matchesSearch && matchesGroup;
    });

    document.getElementById('sChannels').innerText = channels.length;
    document.getElementById('sGroups').innerText = existingGroups.size;
    document.getElementById('sLogos').innerText = channels.filter(c => c.logo).length;

    var start = (currentPage - 1) * pageSize;
    var pageItems = filtered.slice(start, start + pageSize);
    var listContainer = document.getElementById('list');

    if(pageItems.length === 0) {
        listContainer.innerHTML = '<div style="padding:20px;text-align:center;color:#8fa1bc">কোনো চ্যানেল নেই। ফাইল ইমপোর্ট করুন বা নতুন চ্যানেল যোগ করুন।</div>';
    } else {
        var html = '';
        pageItems.forEach(ch => {
            var isChecked = selectedIndices.has(ch._origIdx);
            html += '<div class="channel">' +
                '<input type="checkbox" class="chk" ' + (isChecked ? 'checked' : '') + ' onchange="toggleSelect(' + ch._origIdx + ')">' +
                '<img class="logo" src="' + (ch.logo || 'https://via.placeholder.com/40?text=TV') + '" onerror="this.src=\'https://via.placeholder.com/40?text=TV\'">' +
                '<div><strong>' + (ch.name || 'Untitled') + '</strong><div class="small muted">' + (ch.group || 'General') + '</div></div>' +
                '<div class="tools">' +
                    '<button class="primary" onclick="alert(\'URL: \' + \'' + ch.url + '\')">Play</button>' +
                    '<button class="danger" onclick="deleteChannel(' + ch._origIdx + ')">🗑️</button>' +
                '</div>' +
            '</div>';
        });
        listContainer.innerHTML = html;
    }

    var totalPages = Math.ceil(filtered.length / pageSize) || 1;
    document.getElementById('pageInfo').innerText = 'Page ' + currentPage + ' / ' + totalPages;
    
    document.getElementById('selCount').innerText = selectedIndices.size + ' selected';
    document.getElementById('bulkDelBtn').style.display = selectedIndices.size > 0 ? 'inline-block' : 'none';
}

function toggleSelect(idx) {
    if(selectedIndices.has(idx)) selectedIndices.delete(idx);
    else selectedIndices.add(idx);
    renderPlaylist();
}

function toggleSelAll(checked) {
    if(checked) channels.forEach((_, i) => selectedIndices.add(i));
    else selectedIndices.clear();
    renderPlaylist();
}

function gotoPage(p) {
    if(p < 1) return;
    currentPage = p;
    renderPlaylist();
}

function addCustomChannel() {
    var name = document.getElementById('cName').value.trim();
    var url = document.getElementById('cUrl').value.trim();
    var logo = document.getElementById('cLogo').value.trim();
    var group = document.getElementById('cGroup').value.trim() || 'General';

    if(!name || !url) return alert('নাম এবং URL প্রবেশ করান!');

    channels.push({ name: name, url: url, logo: logo, group: group });
    safeSave();
    
    document.getElementById('cName').value = '';
    document.getElementById('cUrl').value = '';
    document.getElementById('cLogo').value = '';
    
    switchTab('editor', document.querySelectorAll('.nav button')[0]);
    renderPlaylist();
}

function deleteChannel(idx) {
    channels.splice(idx, 1);
    selectedIndices.clear();
    safeSave();
    renderPlaylist();
}

function bulkDelete() {
    if(confirm("সিলেক্ট করা চ্যানেলগুলো মুছে ফেলতে চান?")) {
        var sorted = Array.from(selectedIndices).sort((a,b) => b - a);
        sorted.forEach(idx => channels.splice(idx, 1));
        selectedIndices.clear();
        safeSave();
        renderPlaylist();
    }
}

function importFile(e) {
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(evt) {
        var text = evt.target.result;
        var lines = text.split('\n');
        var currentChan = null;
        var parsed = [];

        lines.forEach(function(line) {
            line = line.trim();
            if(line.startsWith('#EXTINF:')) {
                currentChan = { name: '', url: '', group: 'Imported', logo: '' };
                var logoMatch = line.match(/tvg-logo="([^"]+)"/);
                if(logoMatch) currentChan.logo = logoMatch[1];
                
                var groupMatch = line.match(/group-title="([^"]+)"/);
                if(groupMatch) currentChan.group = groupMatch[1];

                var commaIdx = line.lastIndexOf(',');
                if(commaIdx !== -1) {
                    currentChan.name = line.substring(commaIdx + 1).trim();
                }
            } else if(line && !line.startsWith('#')) {
                if(currentChan) {
                    currentChan.url = line;
                    parsed.push(currentChan);
                    currentChan = null;
                }
            }
        });

        if(parsed.length > 0) {
            channels = channels.concat(parsed);
            safeSave();
            renderPlaylist();
            alert('সফলভাবে ' + parsed.length + ' টি চ্যানেল ইমপোর্ট হয়েছে!');
        } else {
            alert("ফাইল থেকে কোনো বৈধ চ্যানেল পাওয়া যায়নি!");
        }
    };
    reader.readAsText(file);
}

function removeDuplicates() {
    var initial = channels.length;
    var seen = new Set();
    channels = channels.filter(c => {
        if(!c.url || seen.has(c.url)) return false;
        seen.add(c.url);
        return true;
    });
    safeSave();
    renderPlaylist();
    alert((initial - channels.length) + ' টি ডুপ্লিকেট চ্যানেল মোছা হয়েছে!');
}

function autoFixLogos() {
    alert("লোগো আপডেট প্রসেস সম্পন্ন হয়েছে!");
}

function exportM3U() {
    var selectedGroup = document.getElementById('bGroupSelect') ? document.getElementById('bGroupSelect').value : '';
    var exportList = selectedGroup ? channels.filter(c => c.group === selectedGroup) : channels;

    var content = "#EXTM3U\n";
    exportList.forEach(c => {
        content += '#EXTINF:-1 tvg-logo="' + (c.logo || '') + '" group-title="' + (c.group || 'General') + '",' + (c.name || 'Untitled') + '\n';
        content += (c.url || '') + '\n';
    });
    
    var blob = new Blob([content], { type: 'text/plain' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (document.getElementById('playlistTitle').value || 'playlist') + '.m3u';
    a.click();
}

function copyM3UText() {
    var content = "#EXTM3U\n";
    channels.forEach(c => {
        content += '#EXTINF:-1 tvg-logo="' + (c.logo || '') + '" group-title="' + (c.group || 'General') + '",' + (c.name || 'Untitled') + '\n';
        content += (c.url || '') + '\n';
    });
    navigator.clipboard.writeText(content).then(() => alert("কপি করা হয়েছে!"));
}

function clearAllData() {
    if(confirm("সব ডাটা মুছে ফেলতে চান?")) {
        localStorage.clear();
        channels = [];
        renderPlaylist();
    }
}
</script>
</body>
</html>
