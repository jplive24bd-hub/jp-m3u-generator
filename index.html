<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08101f">
<link rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.6.14/hls.min.js"></script>
<title>JP M3U GENERATOR</title>
<style>
*{box-sizing:border-box}html,body{overflow-x:hidden;max-width:100vw}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#070b16;color:#eef3ff}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 14px;background:#18243a;color:#fff}button.primary{background:#2563eb}button.danger{background:#b42318}
.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{background:#0b1220;border-right:1px solid #1d2a40;padding:18px}.brand{font-weight:800;font-size:20px;margin-bottom:22px}.nav button{width:100%;text-align:left;margin:4px 0;background:transparent}.nav button.active,.nav button:hover{background:#17243a}
.main{padding:20px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:15px}.top h1{margin:0;font-size:25px}.actions{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:15px}.stat{background:#0d1627;border:1px solid #1b2a42;padding:15px;border-radius:15px}.stat b{font-size:24px;display:block}.muted{color:#8fa1bc;font-size:13px}
.card{background:#0d1627;border:1px solid #1b2a42;border-radius:16px;padding:16px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
label{font-size:12px;color:#9fb0ca;display:block;margin-bottom:5px}input,select,textarea{width:100%;background:#080f1c;color:#eef3ff;border:1px solid #263752;border-radius:10px;padding:11px;outline:none}textarea{min-height:180px;resize:vertical}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.channel{display:grid;grid-template-columns:28px 45px 55px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border-bottom:1px solid #19263b;overflow:hidden;max-width:100%}.channel:last-child{border-bottom:0}.logo{width:48px;height:48px;object-fit:contain;background:#07101d;border-radius:10px;border:1px solid #25344d}.drag{cursor:grab;color:#7587a3;font-size:20px}.pill{font-size:11px;background:#17243a;padding:5px 8px;border-radius:999px;color:#b8c7dc}.empty{padding:35px;text-align:center;color:#8fa1bc}.chk{width:20px;height:20px;accent-color:#2563eb}
.channel .tools{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.channel .tools button{width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:4px;padding-right:4px}
#bulkBar{position:sticky;top:0;z-index:5;background:#0d1627;border:1px solid #2563eb;border-radius:12px;padding:10px 12px;margin-bottom:12px}
.tab{display:none}.tab.active{display:block}.small{font-size:12px}
@media(max-width:800px){.app{display:block}.side{position:sticky;top:0;z-index:10;border-right:0;border-bottom:1px solid #1d2a40;padding:10px}.brand{display:inline-block;margin:0 15px 0 0}.nav{display:inline-flex;overflow:auto;vertical-align:middle;max-width:72%}.nav button{width:auto;white-space:nowrap}.main{padding:12px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid,.grid3{grid-template-columns:1fr}.channel{grid-template-columns:22px 22px 40px minmax(0,1fr);min-width:0}.channel .tools{grid-column:4;grid-template-columns:repeat(3,minmax(0,1fr))}.top{align-items:flex-start;flex-direction:column}#bulkBar{flex-direction:column;align-items:stretch}#bulkBar button{width:100%}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand">📺 JP M3U GENERATOR <span class="pill">FIXED</span></div>
  <div class="nav">
    <button class="active" data-tab="editor">✏️ Editor</button>
    <button data-tab="create">➕ Create</button>
    <button data-tab="logo">🖼️ Logo Manager</button>
    <button data-tab="builder">🧩 Playlist Builder</button>
    <button data-tab="tools">🛠️ Tools</button>
    <button data-tab="export">📤 Export</button>
  </div>
</aside>
<main class="main">
<div class="top"><h1 id="title">Playlist Editor</h1><div class="actions"><button onclick="document.getElementById('file').click()">📂 Import File</button><button class="primary" onclick="openEditor()">➕ Add Channel</button><input id="file" type="file" accept=".m3u,.m3u8,.txt" hidden onchange="importFile(event)"></div></div>

<section id="editor" class="tab active">
<div class="card"><div class="row"><div style="flex:1;min-width:180px"><label>বর্তমান প্লেলিস্ট</label><select id="playlistSelect" onchange="switchPlaylist(this.value)"></select></div><button class="primary" onclick="newPlaylist()">➕ নতুন প্লেলিস্ট</button><button onclick="renamePlaylist()">✏️ Rename</button><button class="danger" onclick="deletePlaylistCurrent()">🗑️ Delete</button></div></div>
<div class="stats"><div class="stat"><b id="sChannels">0</b><span class="muted">Channels</span></div><div class="stat"><b id="sGroups">0</b><span class="muted">Groups</span></div><div class="stat"><b id="sLogos">0</b><span class="muted">With Logo</span></div><div class="stat"><b id="sBad">0</b><span class="muted">Invalid URL</span></div><div class="stat"><b id="sDead" style="color:#ff8c8c">0</b><span class="muted">Dead</span></div></div>
<div class="card"><div class="grid3"><div><label>Search</label><input id="search" placeholder="Channel name / URL / group" oninput="renderPlaylist()"></div><div><label>Group</label><select id="groupFilter" onchange="renderPlaylist()"><option value="">All Groups</option></select></div><div><label>Playlist Title</label><input id="playlistTitle" value="My M3U Playlist" onchange="saveCurrentState()"></div></div>
<div class="row" style="margin-top:10px"><label class="small" style="display:flex;align-items:center;gap:6px;margin:0"><input type="checkbox" id="onlyDead" style="width:auto" onchange="renderPlaylist()"> শুধু Dead চ্যানেল দেখাও</label><button class="danger" onclick="deleteCategory()">🗑️ এই ক্যাটাগরির সব ডিলিট করুন</button></div></div>
<div class="card">
<div id="bulkBar" class="row"><label class="small" style="display:flex;align-items:center;gap:6px;margin:0"><input type="checkbox" id="selAll" class="chk" onchange="toggleSelAll(this.checked)"> সব সিলেক্ট</label><span class="small muted" id="selCount">0 সিলেক্ট করা হয়েছে</span><button id="bulkMoveBtn" onclick="bulkMoveCategory()" style="display:none">🔀 ক্যাটাগরি বদলান (<span id="bulkMoveCount">0</span>)</button><button class="danger" id="bulkDelBtn" onclick="bulkDelete()" style="display:none">🗑️ নির্বাচিত ডিলিট করুন (<span id="bulkDelCount">0</span>)</button></div>
<div id="list"></div>
<div id="pageBar" class="row" style="justify-content:space-between;margin-top:12px"><div class="row"><button onclick="gotoPage(currentPage-1)">◀ Prev</button><span id="pageInfo" class="small muted">Page 1/1</span><button onclick="gotoPage(currentPage+1)">Next ▶</button></div><div><label style="margin-bottom:0;display:inline;margin-right:6px">প্রতি পেজে</label><select id="pageSize" style="width:auto;display:inline-block" onchange="changePageSize(this.value)"><option value="50">50</option><option value="100">100</option><option value="200">200</option><option value="500">500</option></select></div></div>
</div>
</section>

</main>
</div>

<script>
/* Hybrid Storage Engine: IndexedDB + LocalStorage Sync */
var DB_NAME = 'JP_M3U_HYBRID_DB';
var DB_VERSION = 1;
var db = null;

var playlistsData = {}; 
var currentPlaylistKey = 'default_playlist';
var currentPage = 1;
var pageSize = 50;
var selectedIndices = new Set();

if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist();
}

function initDB() {
    return new Promise(function(resolve) {
        var request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = function(e) {
            var database = e.target.result;
            if (!database.objectStoreNames.contains('app_data')) {
                database.createObjectStore('app_data');
            }
        };
        request.onsuccess = function(e) {
            db = e.target.result;
            resolve(db);
        };
        request.onerror = function() { resolve(null); };
    });
}

function saveToDB(key, val) {
    return new Promise(function(resolve) {
        if (!db) { resolve(false); return; }
        try {
            var tx = db.transaction('app_data', 'readwrite');
            var store = tx.objectStore('app_data');
            store.put(val, key);
            tx.oncomplete = function() { resolve(true); };
            tx.onerror = function() { resolve(false); };
        } catch(e) { resolve(false); }
    });
}

function getFromDB(key) {
    return new Promise(function(resolve) {
        if (!db) { resolve(null); return; }
        try {
            var tx = db.transaction('app_data', 'readonly');
            var store = tx.objectStore('app_data');
            var req = store.get(key);
            req.onsuccess = function() { resolve(req.result || null); };
            req.onerror = function() { resolve(null); };
        } catch(e) { resolve(null); }
    });
}

// LocalStorage থেকে পূর্বের সকল ডাটা নিরাপদে উদ্ধার করার ফাংশন
function getAllStoredData() {
    var restoredData = {};
    try {
        for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            var item = localStorage.getItem(k);
            if (item) {
                try {
                    var parsed = JSON.parse(item);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        restoredData[k] = { title: k, channels: parsed };
                    } else if (typeof parsed === 'object' && parsed.channels) {
                        restoredData[k] = parsed;
                    }
                } catch(e) {}
            }
        }
    } catch(e) {}
    return restoredData;
}

document.addEventListener("DOMContentLoaded", async function() {
    await initDB();
    
    var navButtons = document.querySelectorAll('.nav button');
    var tabs = document.querySelectorAll('.tab');
    navButtons.forEach(function(btn) {
        btn.addEventListener('click', function() {
            var target = btn.getAttribute('data-tab');
            navButtons.forEach(function(b){ b.classList.remove('active'); });
            tabs.forEach(function(t){ t.classList.remove('active'); });
            btn.classList.add('active');
            var el = document.getElementById(target);
            if(el) el.classList.add('active');
        });
    });

    var savedDB = await getFromDB('all_playlists');
    var oldLocalStorageData = getAllStoredData();

    if (savedDB && Object.keys(savedDB).length > 0) {
        playlistsData = savedDB;
        // পুরোনো কোনো কি বাকি থাকলে তা মার্চ করা
        Object.keys(oldLocalStorageData).forEach(function(k) {
            if (!playlistsData[k]) {
                playlistsData[k] = oldLocalStorageData[k];
            }
        });
    } else if (Object.keys(oldLocalStorageData).length > 0) {
        playlistsData = oldLocalStorageData;
    } else {
        playlistsData = {
            'default_playlist': { title: 'My M3U Playlist', channels: [] }
        };
    }

    currentPlaylistKey = Object.keys(playlistsData)[0] || 'default_playlist';
    saveCurrentState();
    updatePlaylistDropdown();
    renderPlaylist();
});

function saveCurrentState() {
    var curTitle = document.getElementById('playlistTitle').value;
    if(playlistsData[currentPlaylistKey]) {
        playlistsData[currentPlaylistKey].title = curTitle;
    }
    // IndexedDB এবং LocalStorage দুটিতেই নিরাপদে সেভ
    saveToDB('all_playlists', playlistsData);
    try {
        localStorage.setItem('all_playlists_backup', JSON.stringify(playlistsData));
    } catch(e) {
        // LocalStorage ভর্তি হয়ে গেলে ক্যাচ করবে কিন্তু এরর/পপআপ দেখাবে না
    }
}

function updatePlaylistDropdown() {
    var select = document.getElementById('playlistSelect');
    select.innerHTML = '';
    Object.keys(playlistsData).forEach(function(key) {
        var opt = document.createElement('option');
        opt.value = key;
        opt.innerText = playlistsData[key].title || key;
        if(key === currentPlaylistKey) opt.selected = true;
        select.appendChild(opt);
    });
}

function switchPlaylist(key) {
    currentPlaylistKey = key;
    document.getElementById('playlistTitle').value = playlistsData[key].title || 'My Playlist';
    selectedIndices.clear();
    currentPage = 1;
    renderPlaylist();
}

function newPlaylist() {
    var name = prompt("নতুন প্লেলিস্টের নাম লিখুন:");
    if(!name) return;
    var newKey = 'plist_' + Date.now();
    playlistsData[newKey] = { title: name, channels: [] };
    currentPlaylistKey = newKey;
    saveCurrentState();
    updatePlaylistDropdown();
    renderPlaylist();
}

function renamePlaylist() {
    var name = prompt("নতুন নাম দিন:", playlistsData[currentPlaylistKey].title);
    if(name) {
        playlistsData[currentPlaylistKey].title = name;
        document.getElementById('playlistTitle').value = name;
        saveCurrentState();
        updatePlaylistDropdown();
    }
}

function deletePlaylistCurrent() {
    if(Object.keys(playlistsData).length <= 1) {
        alert("সর্বশেষ প্লেলিস্ট মুছে ফেলা যাবে না!");
        return;
    }
    if(confirm("আপনি কি নিশ্চিত এই প্লেলিস্টটি মুছে ফেলবেন?")) {
        delete playlistsData[currentPlaylistKey];
        currentPlaylistKey = Object.keys(playlistsData)[0];
        saveCurrentState();
        updatePlaylistDropdown();
        renderPlaylist();
    }
}

function getActiveChannels() {
    return playlistsData[currentPlaylistKey] ? playlistsData[currentPlaylistKey].channels : [];
}

function renderPlaylist() {
    var channels = getActiveChannels();
    var searchVal = document.getElementById('search').value.toLowerCase();
    var groupVal = document.getElementById('groupFilter').value;
    var onlyDead = document.getElementById('onlyDead').checked;

    var groupSelect = document.getElementById('groupFilter');
    var existingGroups = new Set(channels.map(function(c){ return c.group; }).filter(Boolean));
    var currentSelectedGroup = groupSelect.value;
    groupSelect.innerHTML = '<option value="">All Groups</option>';
    existingGroups.forEach(function(g) {
        var opt = document.createElement('option');
        opt.value = g;
        opt.innerText = g;
        if(g === currentSelectedGroup) opt.selected = true;
        groupSelect.appendChild(opt);
    });

    var filtered = channels.filter(function(ch, idx) {
        ch._origIdx = idx;
        var matchesSearch = !searchVal || (ch.name && ch.name.toLowerCase().includes(searchVal)) || (ch.url && ch.url.toLowerCase().includes(searchVal)) || (ch.group && ch.group.toLowerCase().includes(searchVal));
        var matchesGroup = !groupVal || ch.group === groupVal;
        var matchesDead = !onlyDead || ch.isDead;
        return matchesSearch && matchesGroup && matchesDead;
    });

    document.getElementById('sChannels').innerText = channels.length;
    document.getElementById('sGroups').innerText = existingGroups.size;
    document.getElementById('sLogos').innerText = channels.filter(function(c){ return c.logo; }).length;
    document.getElementById('sBad').innerText = channels.filter(function(c){ return !c.url || !c.url.startsWith('http'); }).length;
    document.getElementById('sDead').innerText = channels.filter(function(c){ return c.isDead; }).length;

    var start = (currentPage - 1) * pageSize;
    var end = start + pageSize;
    var pageItems = filtered.slice(start, end);
    var listContainer = document.getElementById('list');

    if(pageItems.length === 0) {
        listContainer.innerHTML = '<div class="empty">কোনো চ্যানেল পাওয়া যায়নি</div>';
    } else {
        var html = '';
        pageItems.forEach(function(ch) {
            var isChecked = selectedIndices.has(ch._origIdx);
            html += '<div class="channel">' +
                '<input type="checkbox" class="chk" ' + (isChecked ? 'checked' : '') + ' onchange="toggleSelect(' + ch._origIdx + ')">' +
                '<span class="drag">⋮⋮</span>' +
                '<img class="logo" src="' + (ch.logo || 'https://via.placeholder.com/48?text=TV') + '" onerror="this.src=\'https://via.placeholder.com/48?text=TV\'">' +
                '<div><strong>' + (ch.name || 'Untitled Channel') + '</strong><div class="small muted">' + (ch.group || 'Unassigned') + '</div></div>' +
                '<div class="tools">' +
                    '<button class="primary" onclick="alert(\'Stream URL: \' + \'' + ch.url + '\')">▶ Play</button>' +
                    '<button onclick="editChannel(' + ch._origIdx + ')">✏️ Edit</button>' +
                    '<button class="danger" onclick="deleteChannel(' + ch._origIdx + ')">🗑️</button>' +
                '</div>' +
            '</div>';
        });
        listContainer.innerHTML = html;
    }

    var totalPages = Math.ceil(filtered.length / pageSize) || 1;
    document.getElementById('pageInfo').innerText = 'Page ' + currentPage + '/' + totalPages;
    updateBulkBar();
}

function updateBulkBar() {
    var count = selectedIndices.size;
    document.getElementById('selCount').innerText = count + ' সিলেক্ট করা হয়েছে';
    document.getElementById('bulkMoveBtn').style.display = count > 0 ? 'inline-block' : 'none';
    document.getElementById('bulkDelBtn').style.display = count > 0 ? 'inline-block' : 'none';
    document.getElementById('bulkMoveCount').innerText = count;
    document.getElementById('bulkDelCount').innerText = count;
}

function toggleSelect(idx) {
    if(selectedIndices.has(idx)) selectedIndices.delete(idx);
    else selectedIndices.add(idx);
    updateBulkBar();
}

function toggleSelAll(checked) {
    var channels = getActiveChannels();
    if(checked) {
        channels.forEach(function(_, i){ selectedIndices.add(i); });
    } else {
        selectedIndices.clear();
    }
    renderPlaylist();
}

function gotoPage(p) {
    if(p < 1) return;
    currentPage = p;
    renderPlaylist();
}

function changePageSize(val) {
    pageSize = parseInt(val);
    currentPage = 1;
    renderPlaylist();
}

function openEditor() {
    var name = prompt("চ্যানেলের নাম:");
    if(!name) return;
    var url = prompt("স্ট্রিম URL:");
    if(!url) return;
    var group = prompt("ক্যাটাগরি/গ্রুপ নাম:", "General") || "General";
    
    getActiveChannels().push({ name: name, url: url, group: group, logo: "" });
    saveCurrentState();
    renderPlaylist();
}

function editChannel(idx) {
    var ch = getActiveChannels()[idx];
    if(!ch) return;
    var name = prompt("চ্যানেলের নাম:", ch.name);
    var url = prompt("URL:", ch.url);
    var group = prompt("গ্রুপ:", ch.group);
    if(name && url) {
        ch.name = name;
        ch.url = url;
        ch.group = group;
        saveCurrentState();
        renderPlaylist();
    }
}

function deleteChannel(idx) {
    getActiveChannels().splice(idx, 1);
    selectedIndices.clear();
    saveCurrentState();
    renderPlaylist();
}

function bulkDelete() {
    if(confirm("নির্বাচিত সকল চ্যানেল ডিলিট করবেন?")) {
        var sorted = Array.from(selectedIndices).sort(function(a,b){ return b - a; });
        var channels = getActiveChannels();
        sorted.forEach(function(idx){ channels.splice(idx, 1); });
        selectedIndices.clear();
        saveCurrentState();
        renderPlaylist();
    }
}

function bulkMoveCategory() {
    var newGrp = prompt("নতুন ক্যাটাগরির নাম দিন:");
    if(!newGrp) return;
    var channels = getActiveChannels();
    selectedIndices.forEach(function(idx){
        if(channels[idx]) channels[idx].group = newGrp;
    });
    selectedIndices.clear();
    saveCurrentState();
    renderPlaylist();
}

function deleteCategory() {
    var groupVal = document.getElementById('groupFilter').value;
    if(!groupVal) {
        alert("প্রথমে একটি ক্যাটাগরি ফিল্টার সিলেক্ট করুন!");
        return;
    }
    if(confirm('আপনি কি "' + groupVal + '" ক্যাটাগরির সব চ্যানেল ডিলিট করতে চান?')) {
        playlistsData[currentPlaylistKey].channels = getActiveChannels().filter(function(c){ return c.group !== groupVal; });
        selectedIndices.clear();
        saveCurrentState();
        renderPlaylist();
    }
}

function importFile(e) {
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(evt) {
        var text = evt.target.result;
        var lines = text.split('\n');
        var currentChan = null;
        var parsed = [];

        lines.forEach(function(line) {
            line = line.trim();
            if(line.startsWith('#EXTINF:')) {
                currentChan = { name: '', url: '', group: 'Imported', logo: '' };
                var logoMatch = line.match(/tvg-logo="([^"]+)"/);
                if(logoMatch) currentChan.logo = logoMatch[1];
                
                var groupMatch = line.match(/group-title="([^"]+)"/);
                if(groupMatch) currentChan.group = groupMatch[1];

                var commaIdx = line.lastIndexOf(',');
                if(commaIdx !== -1) {
                    currentChan.name = line.substring(commaIdx + 1).trim();
                }
            } else if(line && !line.startsWith('#')) {
                if(currentChan) {
                    currentChan.url = line;
                    parsed.push(currentChan);
                    currentChan = null;
                }
            }
        });

        if(parsed.length > 0) {
            playlistsData[currentPlaylistKey].channels.push.apply(playlistsData[currentPlaylistKey].channels, parsed);
            saveCurrentState();
            renderPlaylist();
            alert('সফলভাবে ' + parsed.length + ' টি চ্যানেল ইমপোর্ট করা হয়েছে!');
        } else {
            alert("ফাইল থেকে কোনো বৈধ চ্যানেল পাওয়া যায়নি!");
        }
    };
    reader.readAsText(file);
}
</script>
</body>
</html>
